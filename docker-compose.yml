services:
  request-system:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/requests.db}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - request_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
volumes:
  request_data:
