<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RequestDesk</title>
<style>
:root{font-family:Arial,sans-serif;color:#17283f;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.layout{display:flex;min-height:100vh}.sidebar{background:#13253d;color:white;width:220px;padding:24px 16px}.brand{font-weight:bold;font-size:20px;margin-bottom:28px}.sidebar a{display:block;color:#e5edf7;padding:11px;border-radius:8px;text-decoration:none}.sidebar a:hover{background:#28415f}.main{width:min(1200px,100%);margin:0 auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#718198}.card{background:white;border:1px solid #dce5ef;border-radius:12px;padding:18px;margin:14px 0}.toolbar,.filters,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,select,textarea{font:inherit;padding:10px;border:1px solid #cbd7e4;border-radius:7px}input,select{min-width:150px}textarea{width:100%;min-height:80px}.btn{border:0;background:#2463eb;color:white;padding:10px 14px;border-radius:7px;cursor:pointer}.secondary{background:#eaf0f8;color:#243d5a}.danger{background:#b93646}.badge{padding:5px 9px;border-radius:20px;background:#eaf0f8}.notice{padding:10px;background:#fff4d6;border-radius:6px;color:#805d12}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.request h3{margin:6px 0}.request small{color:#718198}.hidden{display:none}.err{color:#ad2638;min-height:1.2em}label{display:block;font-weight:bold;margin:10px 0 5px}.modal{display:none;position:fixed;inset:0;background:#10243b99;align-items:center;justify-content:center}.modal.open{display:flex}.modal .card{width:min(440px,92vw)}@media(max-width:650px){.sidebar{width:58px;padding:15px 6px}.brand{font-size:0}.brand:first-letter{font-size:20px}.sidebar a{font-size:0}.sidebar a:first-letter{font-size:17px}.main{padding:14px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="layout"><aside class="sidebar"><div class="brand">◈ RequestDesk</div><a href="#list">▤ Заявки</a><a href="#new">＋ Создать</a><a href="/docs" target="_blank">⌘ API docs</a></aside><main class="main">
<header class="top"><div><div class="muted">Учебная система · демонстрационные данные</div><h1>Система учёта заявок</h1></div><button class="btn" onclick="openCreate()">＋ Новая заявка</button></header>
<section class="card"><div class="filters"><input id="q" placeholder="Поиск по номеру, теме, описанию"><select id="status"><option value="">Все статусы</option></select><select id="category"><option value="">Все категории</option></select><select id="priority"><option value="">Любой приоритет</option><option value="low">Низкий</option><option value="normal">Обычный</option><option value="high">Высокий</option><option value="urgent">Срочный</option></select><button class="btn" onclick="loadRequests()">Найти</button><button class="btn secondary" onclick="resetFilters()">Сбросить</button></div><p id="error" class="err"></p><div id="requests" class="grid"></div><p id="empty" class="notice hidden">Заявки не найдены. Попробуйте изменить фильтры.</p></section>
<section id="form" class="card hidden"><h2 id="formTitle">Новая заявка</h2><form id="requestForm"><input type="hidden" id="requestId"><label>Тема *</label><input id="title" minlength="3" maxlength="160" required><label>Описание *</label><textarea id="description" minlength="5" maxlength="5000" required></textarea><label>Категория *</label><select id="formCategory" required></select><label>Приоритет</label><select id="formPriority"><option value="low">Низкий</option><option value="normal" selected>Обычный</option><option value="high">Высокий</option><option value="urgent">Срочный</option></select><label>Исполнитель</label><select id="assignee"><option value="">Не назначен</option></select><p id="formError" class="err"></p><div class="actions"><button class="btn" type="submit">Сохранить</button><button class="btn secondary" type="button" onclick="closeForm()">Отмена</button></div></form></section>
<section id="detail" class="card hidden"></section></main></div>
<div id="confirm" class="modal"><div class="card"><h3>Архивировать заявку?</h3><p>Она исчезнет из обычного списка, но останется в базе.</p><div class="actions"><button class="btn danger" onclick="archiveConfirmed()">Архивировать</button><button class="btn secondary" onclick="closeConfirm()">Отмена</button></div></div></div>
<script>
const api='';let categories=[],statuses=[],users=[],archiveId=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function request(url,options={}){const r=await fetch(api+url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(r.status===204)return null;const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail?.message||data.detail||data.error?.message||`HTTP ${r.status}`);return data}
async function init(){try{[categories,statuses,users]=await Promise.all(['/categories','/statuses','/users'].map(x=>request(x)));for(const x of statuses)$('status').insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.name)}</option>`);for(const x of categories){$('category').insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.name)}</option>`);$('formCategory').insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.name)}</option>`)}for(const x of users.filter(u=>u.role==='executor'))$('assignee').insertAdjacentHTML('beforeend',`<option value="${x.id}">${esc(x.full_name)}</option>`);await loadRequests()}catch(e){$('error').textContent=e.message}}
async function loadRequests(){ $('error').textContent='';try{const p=new URLSearchParams();if($('q').value.trim())p.set('q',$('q').value.trim());if($('status').value)p.set('status_id',$('status').value);if($('category').value)p.set('category_id',$('category').value);if($('priority').value)p.set('priority',$('priority').value);const rows=await request('/requests?'+p);$('requests').innerHTML=rows.map(r=>`<article class="card request"><small>#${r.id} · ${new Date(r.created_at+'Z').toLocaleString('ru-RU')}</small><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><p><span class="badge">${esc(r.status)}</span> <span class="badge">${esc(r.category)}</span> <span class="badge">${esc(r.priority)}</span></p><small>Автор: ${esc(r.requester)} · Исполнитель: ${esc(r.assignee||'не назначен')}</small><div class="actions"><button class="btn" onclick="showDetail(${r.id})">Открыть</button><button class="btn secondary" onclick="editRequest(${r.id})">Изменить</button></div></article>`).join('');$('empty').classList.toggle('hidden',rows.length>0)}catch(e){$('error').textContent=e.message}}
function resetFilters(){$('q').value='';$('status').value='';$('category').value='';$('priority').value='';loadRequests()}
function openCreate(){$('requestId').value='';$('formTitle').textContent='Новая заявка';$('title').value='';$('description').value='';$('formPriority').value='normal';$('assignee').value='';$('form').classList.remove('hidden');$('detail').classList.add('hidden');$('form').scrollIntoView({behavior:'smooth'})}
function closeForm(){$('form').classList.add('hidden');$('formError').textContent=''}
async function editRequest(id){try{const r=await request('/requests/'+id);$('requestId').value=r.id;$('formTitle').textContent=`Редактирование #${r.id}`;$('title').value=r.title;$('description').value=r.description;$('formCategory').value=r.category_id;$('formPriority').value=r.priority;$('assignee').value=r.assignee_id||'';$('form').classList.remove('hidden');$('detail').classList.add('hidden');$('form').scrollIntoView({behavior:'smooth'})}catch(e){$('error').textContent=e.message}}
$('requestForm').addEventListener('submit',async e=>{e.preventDefault();$('formError').textContent='';const id=$('requestId').value;const body={title:$('title').value,description:$('description').value,category_id:Number($('formCategory').value),priority:$('formPriority').value,assignee_id:$('assignee').value?Number($('assignee').value):null};try{if(id){await request('/requests/'+id,{method:'PATCH',body:JSON.stringify(body)})}else{body.requester_id=users.find(u=>u.role==='requester')?.id||1;await request('/requests',{method:'POST',body:JSON.stringify(body)})}closeForm();await loadRequests()}catch(e){$('formError').textContent=e.message}});
async function showDetail(id){try{const r=await request('/requests/'+id);const comments=await request(`/requests/${id}/comments`);$('detail').innerHTML=`<div class="top"><div><small>#${r.id} · ${esc(r.created_at)}</small><h2>${esc(r.title)}</h2></div><span class="badge">${esc(r.status)}</span></div><p>${esc(r.description)}</p><p>Категория: ${esc(r.category)} · Приоритет: ${esc(r.priority)}</p><p>Заявитель: ${esc(r.requester)} · Исполнитель: ${esc(r.assignee||'не назначен')}</p><label>Статус</label><select id="detailStatus">${statuses.map(s=>`<option value="${s.id}" ${s.id===r.status_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select> <button class="btn" onclick="saveStatus(${r.id})">Обновить статус</button><h3>Комментарии</h3>${comments.map(c=>`<p><b>${esc(c.author)}</b>: ${esc(c.body)}</p>`).join('')}<textarea id="comment" placeholder="Новый комментарий"></textarea><button class="btn" onclick="addComment(${r.id})">Добавить комментарий</button> <button class="btn secondary" onclick="closeDetail()">Свернуть</button> <button class="btn danger" onclick="askArchive(${r.id})">Архивировать</button>`;$('detail').classList.remove('hidden');$('detail').scrollIntoView({behavior:'smooth'})}catch(e){$('error').textContent=e.message}}
function closeDetail(){$('detail').classList.add('hidden')}
async function saveStatus(id){try{await request(`/requests/${id}/status`,{method:'PATCH',body:JSON.stringify({status_id:Number($('detailStatus').value),actor_id:users.find(u=>u.role==='operator')?.id||1})});await showDetail(id);await loadRequests()}catch(e){$('error').textContent=e.message}}
async function addComment(id){try{await request(`/requests/${id}/comments`,{method:'POST',body:JSON.stringify({author_id:users.find(u=>u.role==='operator')?.id||1,body:$('comment').value})});await showDetail(id)}catch(e){$('error').textContent=e.message}}
function askArchive(id){archiveId=id;$('confirm').classList.add('open')}function closeConfirm(){$('confirm').classList.remove('open');archiveId=null}async function archiveConfirmed(){try{await request('/requests/'+archiveId,{method:'DELETE'});closeConfirm();closeDetail();await loadRequests()}catch(e){closeConfirm();$('error').textContent=e.message}}
init();
</script></body></html>
